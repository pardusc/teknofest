{% extends "main/base.html" %}

{% block title %}Edit profile · Pardus Teknofest{% endblock %}

{% block content %}
  <h1>Edit profile</h1>
  <p class="muted">Fields marked as required must be filled in.</p>

  <form method="post" enctype="multipart/form-data" class="card form">
    {% csrf_token %}
    {{ form.as_p }}

    <button class="button" type="submit">Save</button>
    <a class="button secondary" href="{% url 'main:profile' %}">Cancel</a>
  </form>
{% endblock %}
