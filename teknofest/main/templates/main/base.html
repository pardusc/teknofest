{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Pardus Teknofest{% endblock %}</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --fg: #1f2328;
      --muted: #5d6670;
      --accent: #0f6b4f;
      --border: #dfe3e0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
    }
    header, footer {
      background: #fff;
      border-bottom: 1px solid var(--border);
    }
    footer { border-top: 1px solid var(--border); border-bottom: 0; }
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
    }
    header .container, footer .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand { font-weight: 700; color: var(--accent); text-decoration: none; }
    nav a { color: var(--muted); margin-left: 1rem; text-decoration: none; }
    nav a:hover { color: var(--accent); }
    main .container { padding: 3rem 1.5rem; }
    h1 { font-size: 2rem; margin-top: 0; }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      margin-top: 1.5rem;
    }
    .muted { color: var(--muted); }
    code { background: #eef1ef; padding: 0.1rem 0.35rem; border-radius: 4px; }
    footer { color: var(--muted); font-size: 0.875rem; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <a class="brand" href="{% url 'main:home' %}">Pardus Teknofest</a>
      <nav>
        <a href="/admin/">Admin</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer>
    <div class="container">
      <span>Application and evaluation platform</span>
      <span>GPL-3.0</span>
    </div>
  </footer>
</body>
</html>
