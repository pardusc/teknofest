{% load i18n %}
{% get_current_language as CURRENT_LANGUAGE %}
<form class="ba-language-switcher" action="{% url 'set_language' %}" method="post" aria-label="Dil">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" name="language" value="tr" lang="tr" class="{% if CURRENT_LANGUAGE == 'tr' %}active{% endif %}" aria-pressed="{% if CURRENT_LANGUAGE == 'tr' %}true{% else %}false{% endif %}" title="Türkçe">TR</button>
  <button type="submit" name="language" value="en" lang="en" class="{% if CURRENT_LANGUAGE == 'en' %}active{% endif %}" aria-pressed="{% if CURRENT_LANGUAGE == 'en' %}true{% else %}false{% endif %}" title="English">EN</button>
</form>
