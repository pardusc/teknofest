{% load i18n %}
<button class="sticky toggle-nav-sidebar ba-sr-toggle" id="toggle-nav-sidebar"
        aria-label="{% translate 'Toggle navigation' %}" aria-controls="nav-sidebar" tabindex="-1" aria-hidden="true"></button>
<nav class="sticky ba-sidebar" id="nav-sidebar" aria-label="{% translate 'Sidebar' %}">
  <div class="ba-sidebar-mobile-header">
    <span class="ba-sidebar-mobile-title">{% translate 'Navigation' %}</span>
    <button type="button" class="btn btn-icon btn-outline theme-secondary ba-sidebar-close"
            id="ba-sidebar-close" aria-label="{% translate 'Close navigation' %}">
      <svg class="ba-icon" aria-hidden="true"><use href="#ba-x"></use></svg>
    </button>
  </div>
  <div class="ba-sidebar-search">
    <svg class="ba-icon" aria-hidden="true"><use href="#ba-search"></use></svg>
    <input type="search" id="nav-filter" class="form-control form-control-sm"
           placeholder="{% translate 'Start typing to filter…' %}"
           aria-label="{% translate 'Filter navigation items' %}">
  </div>
  <div class="ba-sidebar-scroll">
    {% include 'admin/app_list.html' with app_list=available_apps show_changelinks=False %}
  </div>
</nav>
