{% load i18n %}
<button type="button"
        class="btn btn-icon btn-outline theme-secondary ba-theme-toggle theme-toggle"
        aria-label="{% translate 'Toggle theme' %}"
        title="{% translate 'Toggle theme' %}"
        data-label-auto="{% translate 'Toggle theme (current theme: auto)' %}"
        data-label-light="{% translate 'Toggle theme (current theme: light)' %}"
        data-label-dark="{% translate 'Toggle theme (current theme: dark)' %}">
  <span class="visually-hidden theme-label-when-auto">{% translate 'Toggle theme (current theme: auto)' %}</span>
  <span class="visually-hidden theme-label-when-light">{% translate 'Toggle theme (current theme: light)' %}</span>
  <span class="visually-hidden theme-label-when-dark">{% translate 'Toggle theme (current theme: dark)' %}</span>
  <svg aria-hidden="true" class="ba-icon theme-icon-when-auto"><use href="#icon-auto"></use></svg>
  <svg aria-hidden="true" class="ba-icon theme-icon-when-dark"><use href="#icon-moon"></use></svg>
  <svg aria-hidden="true" class="ba-icon theme-icon-when-light"><use href="#icon-sun"></use></svg>
</button>
