{% load i18n admin_urls %}
{% block object-tools-items %}
  {% url opts|admin_urlname:'history' original.pk|admin_urlquote as history_url %}
  <a href="{% add_preserved_filters history_url %}" class="btn btn-outline theme-secondary btn-sm historylink">
    <svg class="ba-icon" aria-hidden="true"><use href="#ba-history"></use></svg>
    {% translate "History" %}
  </a>
  {% if has_absolute_url %}
    <a href="{{ absolute_url }}" class="btn btn-outline theme-secondary btn-sm viewsitelink">
      <svg class="ba-icon" aria-hidden="true"><use href="#ba-external"></use></svg>
      {% translate "View on site" %}
    </a>
  {% endif %}
{% endblock %}
