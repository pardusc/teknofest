{% load i18n %}
<details class="ba-filter" data-filter-title="{{ title }}" open>
  <summary class="ba-filter-summary">
    <span>{% blocktranslate with filter_title=title %}By {{ filter_title }}{% endblocktranslate %}</span>
    <svg class="ba-icon ba-filter-chevron" aria-hidden="true"><use href="#ba-chevron-down"></use></svg>
  </summary>
  <ul class="ba-filter-list">
    {% for choice in choices %}
      <li{% if choice.selected %} class="selected"{% endif %}>
        <a href="{{ choice.query_string|iriencode }}"{% if choice.selected %} aria-current="true"{% endif %}>
          {% if choice.selected %}<svg class="ba-icon" aria-hidden="true"><use href="#ba-check"></use></svg>{% else %}<span class="ba-filter-check" aria-hidden="true"></span>{% endif %}
          <span>{{ choice.display }}</span>
        </a>
      </li>
    {% endfor %}
  </ul>
</details>
